    <div class="stgrid" style="margin-top:14px"><div><h3>Drivers</h3><table>${head}<tbody>${drows}</tbody></table></div><div><h3>Constructors</h3><table>${head}<tbody>${trows}</tbody></table></div></div>`;
}

/* ---------- compare laps ---------- */
const cmpCanvas = $('cmpMap'), cctx = cmpCanvas.getContext('2d');
function cmpLaps(n){
  const ls = (S.lapsBy[n] || []).filter(l => l.dur && !l.out && !l.inn && (l.v > 1 || !S.isRace) && S.X[n]);
  const fastest = ls.reduce((b, l) => (!b || l.dur < b.dur ? l : b), null);
  return { ls, fastest };
}
function fastestDrivers(){
  return [...S.drivers.keys()].map(n => ({ n, f: cmpLaps(n).fastest })).filter(x => x.f).sort((a, b) => a.f.dur - b.f.dur).map(x => x.n);
}
function trace(n, v){
  const key = n + '-' + v;
  if (S.cmpCache[key]) return S.cmpCache[key];
  const l = lapObj(n, v); if (!l || !l.dur) return null;
  const dur = l.dur * 1000, step = 1000 / S.hz;
  const t = [], x = [], y = [];
  for (let tm = 0; tm <= dur + 1; tm += step){ const p = sampleAt(n, l.t + Math.min(tm, dur)); if (p){ t.push(Math.min(tm, dur)); x.push(p[0]); y.push(p[1]); } }
  if (t.length < 10) return null;
  const d = [0];
  for (let i = 1; i < t.length; i++) d.push(d[i - 1] + Math.hypot(x[i] - x[i - 1], y[i] - y[i - 1]));
  const D = d[d.length - 1] || 1, f = d.map(v2 => v2 / D);
  const telOk = typeof S.tel[n] === 'object' && S.tel[n] !== null;
  const spd = t.map((tm, i) => {
    if (telOk){ const v2 = telAt(n, l.t + tm); if (v2) return v2.spd; }
    const a = Math.max(0, i - 2), b = Math.min(t.length - 1, i + 2);
    return (d[b] - d[a]) / Math.max(1, (t[b] - t[a]) / 1000) * 3.6;
  });
  const thr = telOk ? t.map(tm => telAt(n, l.t + tm)?.thr ?? null) : null;
  const brk = telOk ? t.map(tm => telAt(n, l.t + tm)?.brk ?? null) : null;
  return (S.cmpCache[key] = { n, v, start: l.t, dur, t, x, y, f, spd, thr, brk, tel: telOk, cmp: l.cmp });
}
function interp(xs, ys, x){
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  const i = bsLast(xs, x), a = (x - xs[i]) / ((xs[i + 1] - xs[i]) || 1);
  return ys[i] + (ys[i + 1] - ys[i]) * a;
}
const timeAtFrac = (tr, f) => interp(tr.f, tr.t, f);
const fracAtTime = (tr, g) => interp(tr.t, tr.f, g);

function renderCompare(){
  const ctl = $('cmpCtl'), charts = $('cmpCharts');
  const fast = fastestDrivers();
  if (fast.length < 2){ ctl.innerHTML = ''; charts.innerHTML = '<p class="empty">Not enough timed laps in this session to compare.</p>'; cctx.clearRect(0, 0, cmpCanvas.width, cmpCanvas.height); return; }
  const C = S.cmp;
  if (C.a == null || !S.drivers.has(C.a)) C.a = fast[0];
  if (C.b == null || !S.drivers.has(C.b) || C.b === C.a) C.b = fast.find(n => n !== C.a);
  const la = cmpLaps(C.a), lb = cmpLaps(C.b);
  if (!la.ls.some(l => l.v === C.la)) C.la = la.fastest?.v;
  if (!lb.ls.some(l => l.v === C.lb)) C.lb = lb.fastest?.v;
  ensureTel(C.a); ensureTel(C.b);
  const [ca, cb] = distinctColor(C.a, C.b);
  const dopts = sel => fast.map(n => `<option value="${n}" ${n === sel ? 'selected' : ''}>${esc(codeOf(n))}</option>`).join('');
  const lopts = (info, sel) => info.ls.map(l => `<option value="${l.v}" ${l.v === sel ? 'selected' : ''}>Lap ${l.v}, ${fmtDur(l.dur)}${l === info.fastest ? ' (fastest)' : ''}${l.cmp ? ', ' + TYRE_NAME[l.cmp] : ''}</option>`).join('');
  ctl.innerHTML = `
    <div class="cmp-side" style="--c:${ca}"><b>A</b><select id="cA" aria-label="Driver A">${dopts(C.a)}</select><select id="cLA" aria-label="Driver A lap">${lopts(la, C.la)}</select></div>
    <div class="cmp-side" style="--c:${cb}"><b>B</b><select id="cB" aria-label="Driver B">${dopts(C.b)}</select><select id="cLB" aria-label="Driver B lap">${lopts(lb, C.lb)}</select></div>
    <div class="cmp-play"><button class="play" id="cPlay" aria-label="Play both laps">${C.playing ? PAUSE_ICON : PLAY_ICON}</button><input type="range" id="cScrub" min="0" max="1000" value="0" aria-label="Position in the lap"><select id="cSpeed" aria-label="Ghost speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
    <div class="cmp-read" id="cRead"></div>`;
  $('cSpeed').value = String(C.speed);
  $('cA').onchange = e => { C.a = +e.target.value; C.la = null; C.g = 0; renderCompare(); };
  $('cB').onchange = e => { C.b = +e.target.value; C.lb = null; C.g = 0; renderCompare(); };
  $('cLA').onchange = e => { C.la = +e.target.value; C.g = 0; renderCompare(); };
  $('cLB').onchange = e => { C.lb = +e.target.value; C.g = 0; renderCompare(); };
  $('cSpeed').onchange = e => { C.speed = +e.target.value; };
  $('cPlay').onclick = () => {
    const A = trace(C.a, C.la), B = trace(C.b, C.lb); if (!A || !B) return;
    if (!C.playing && C.g >= Math.max(A.dur, B.dur)) C.g = 0;
    C.playing = !C.playing; $('cPlay').innerHTML = C.playing ? PAUSE_ICON : PLAY_ICON;
  };
  $('cScrub').oninput = e => { const A = trace(C.a, C.la), B = trace(C.b, C.lb); if (!A || !B) return; C.g = +e.target.value / 1000 * Math.max(A.dur, B.dur); C.playing = false; $('cPlay').innerHTML = PLAY_ICON; drawCompare(); };
  $('cmpLegend').innerHTML = `<span><i style="--c:${ca}"></i>${esc(codeOf(C.a))} faster</span><span><i style="--c:${cb}"></i>${esc(codeOf(C.b))} faster</span>`;

  const A = trace(C.a, C.la), B = trace(C.b, C.lb);
  if (!A || !B){ charts.innerHTML = '<p class="empty">No position data for one of these laps.</p>'; drawCompare(); return; }
  S.chartW = Math.max(300, charts.clientWidth - 26);
  // mini-sector dominance
  const K = 25; C.dom = [];
  let winsA = 0;
  for (let k = 0; k < K; k++){
    const dA = timeAtFrac(A, (k + 1) / K) - timeAtFrac(A, k / K), dB = timeAtFrac(B, (k + 1) / K) - timeAtFrac(B, k / K);
    const a = dA <= dB; if (a) winsA++; C.dom.push(a);
  }
  // charts: speed and delta against lap distance
  const N = 240, fs = Array.from({ length: N + 1 }, (_, i) => i / N);
  const spdA = fs.map(f => interp(A.f, A.spd, f)), spdB = fs.map(f => interp(B.f, B.spd, f));
  const rawDelta = fs.map(f => (timeAtFrac(B, f) - timeAtFrac(A, f)) / 1000);
  // positions come 4 times a second, so smooth out the jitter
  const delta = rawDelta.map((_, i) => { let s2 = 0, c = 0; for (let k = Math.max(0, i - 4); k <= Math.min(N, i + 4); k++){ s2 += rawDelta[k]; c++; } return s2 / c; });
  const sMax = Math.max(...spdA, ...spdB), sMin = Math.min(...spdA, ...spdB);
  const Fs = chartFrame({ h: 260, x0: 0, x1: 100, y0: Math.max(0, sMin - 15), y1: sMax + 10, xTicks: [0, 25, 50, 75, 100], xFmt: v => v + '%', yTicks: niceTicks(Math.max(0, sMin - 15), sMax + 10, 5), xLabel: 'Distance through the lap', yLabel: 'Speed (km/h)', label: 'Speed comparison' });
  const pl = (arr, col, F, w = 2) => `<polyline points="${arr.map((v, i) => F.sx(fs[i] * 100) + ',' + F.sy(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
  let gs = Fs.grid + pl(spdA, ca, Fs) + pl(spdB, cb, Fs) + `<line class="nowline" id="cNow1" x1="-10" x2="-10" y1="${Fs.T}" y2="${Fs.H - Fs.B}"/>`;
  const dm = Math.max(0.1, ...delta.map(Math.abs)) * 1.15;
  const Fd = chartFrame({ h: 200, x0: 0, x1: 100, y0: -dm, y1: dm, xTicks: [0, 25, 50, 75, 100], xFmt: v => v + '%', yTicks: niceTicks(-dm, dm, 4), yFmt: v => (v > 0 ? '+' : '') + v.toFixed(Math.abs(dm) < 1 ? 2 : 1), xLabel: 'Distance through the lap', yLabel: `Time gap (s), above zero: ${codeOf(C.a)} ahead`, label: 'Time gap through the lap' });
  let gd = Fd.grid + `<line class="zero" x1="${Fd.L}" x2="${Fd.W - Fd.R}" y1="${Fd.sy(0)}" y2="${Fd.sy(0)}"/>` + pl(delta, COL.text, Fd, 2.2) + `<line class="nowline" id="cNow2" x1="-10" x2="-10" y1="${Fd.T}" y2="${Fd.H - Fd.B}"/>`;
  let thrBox = '';
  if (A.tel && B.tel && A.thr && B.thr){
    const thA = fs.map(f => interp(A.f, A.thr.map(v => v ?? 0), f)), thB = fs.map(f => interp(B.f, B.thr.map(v => v ?? 0), f));
    const Ft = chartFrame({ h: 150, x0: 0, x1: 100, y0: 0, y1: 100, xTicks: [0, 25, 50, 75, 100], xFmt: v => v + '%', yTicks: [0, 50, 100], yFmt: v => v + '%', yLabel: 'Throttle', label: 'Throttle comparison' });
    thrBox = `<div class="chartbox"><h4>Throttle</h4>${Ft.open}${Ft.grid}${pl(thA, ca, Ft, 1.8)}${pl(thB, cb, Ft, 1.8)}<line class="nowline" id="cNow3" x1="-10" x2="-10" y1="${Ft.T}" y2="${Ft.H - Ft.B}"/></svg></div>`;
    C.Ft = Ft;
  } else C.Ft = null;
  C.Fs = Fs; C.Fd = Fd;
  const gap = (B.dur - A.dur) / 1000;
  charts.innerHTML = `
    <div class="summary" style="margin:0 0 12px">
      <div><span>${esc(codeOf(C.a))}, lap ${A.v}</span><br><b style="color:${ca}">${fmtDur(A.dur / 1000)}</b></div>
      <div><span>${esc(codeOf(C.b))}, lap ${B.v}</span><br><b style="color:${cb}">${fmtDur(B.dur / 1000)}</b></div>
      <div><span>Difference</span><br><b>${Math.abs(gap).toFixed(3)} s</b> <span>to ${esc(gap >= 0 ? codeOf(C.a) : codeOf(C.b))}</span></div>
      <div><span>Mini-sectors won</span><br><b>${winsA}–${K - winsA}</b></div>
    </div>
    <div class="chartbox"><h4>Speed</h4>${Fs.open}${gs}</svg></div>
    <div class="chartbox"><h4>Time gap through the lap</h4>${Fd.open}${gd}</svg></div>
    ${thrBox}
    <p class="note">${A.tel && B.tel ? 'Speed and throttle come from car telemetry.' : 'Speed is estimated from GPS positions because this session has no telemetry, so it is smoother than the real trace.'} The map shows which driver was faster through each of ${K} equal parts of the lap.</p>`;
  resizeCompare();
}
let viewResizeTimer = null, lastViewW = 0;
new ResizeObserver(() => {
  const w = $('viewport').clientWidth;
  if (Math.abs(w - lastViewW) < 8) return;
  lastViewW = w;
  clearTimeout(viewResizeTimer);
  viewResizeTimer = setTimeout(() => { if (S.view === 'charts') renderCharts(); else if (S.view === 'compare') renderCompare(); }, 200);
}).observe($('viewport'));
function resizeCompare(){
  const dpr = window.devicePixelRatio || 1;
  cmpCanvas.width = Math.round(cmpCanvas.clientWidth * dpr); cmpCanvas.height = Math.round(cmpCanvas.clientHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCompare();
}
new ResizeObserver(() => { if (S.view === 'compare') resizeCompare(); }).observe(cmpCanvas);
function cmpFit(){
  const W = cmpCanvas.clientWidth, H = cmpCanvas.clientHeight;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of S.outline){ const [a, b] = rot(p[0], p[1]); minX = Math.min(minX, a); maxX = Math.max(maxX, a); minY = Math.min(minY, b); maxY = Math.max(maxY, b); }
  const pad = 22, w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  const s = Math.min((W - 2 * pad) / w, (H - 2 * pad - 20) / h);
  return (x, y) => { const [a, b] = rot(x, y); return [pad + ((W - 2 * pad) - w * s) / 2 + (a - minX) * s, pad + ((H - 2 * pad - 20) - h * s) / 2 + (b - minY) * s]; };
}
function drawCompare(){
  const W = cmpCanvas.clientWidth, H = cmpCanvas.clientHeight;
  cctx.clearRect(0, 0, W, H);
  const C = S.cmp;
  const A = C.a != null && C.la != null ? trace(C.a, C.la) : null, B = C.b != null && C.lb != null ? trace(C.b, C.lb) : null;
  if (!S.outline.length || !W) return;
  const P2 = cmpFit();
  cctx.lineJoin = 'round'; cctx.lineCap = 'round';
  cctx.beginPath(); S.outline.forEach((p, i) => { const [x, y] = P2(p[0], p[1]); i ? cctx.lineTo(x, y) : cctx.moveTo(x, y); }); cctx.closePath();
  cctx.strokeStyle = COL.kerb; cctx.lineWidth = 14; cctx.stroke();
  if (!A || !B) return;
  const [ca, cb] = distinctColor(C.a, C.b), K = (C.dom || []).length || 1;
  cctx.lineWidth = 7;
  for (let i = 1; i < A.x.length; i++){
    const k = Math.min(K - 1, Math.floor(A.f[i] * K));
    const [x1, y1] = P2(A.x[i - 1], A.y[i - 1]), [x2, y2] = P2(A.x[i], A.y[i]);
    cctx.strokeStyle = C.dom && C.dom[k] ? ca : cb;
    cctx.beginPath(); cctx.moveTo(x1, y1); cctx.lineTo(x2, y2); cctx.stroke();
  }
  // ghost cars
  cctx.font = '700 12px "Barlow Condensed", "Arial Narrow", sans-serif';
  for (const [tr, col] of [[B, cb], [A, ca]]){
    const i = Math.min(tr.t.length - 1, Math.max(0, bsLast(tr.t, C.g)));
    const j = Math.min(tr.t.length - 1, i + 1), a = tr.t[j] > tr.t[i] ? Math.min(1, (C.g - tr.t[i]) / (tr.t[j] - tr.t[i])) : 0;
    const [x, y] = P2(tr.x[i] + (tr.x[j] - tr.x[i]) * a, tr.y[i] + (tr.y[j] - tr.y[i]) * a);
    cctx.beginPath(); cctx.arc(x, y, 7, 0, Math.PI * 2); cctx.fillStyle = col; cctx.fill(); cctx.lineWidth = 2; cctx.strokeStyle = COL.bg; cctx.stroke();
    cctx.lineWidth = 3; cctx.strokeStyle = COL.bg; cctx.strokeText(codeOf(tr.n), x + 10, y + 4); cctx.fillStyle = COL.text; cctx.fillText(codeOf(tr.n), x + 10, y + 4);
  }
  // readout + markers
  const fA = fracAtTime(A, Math.min(C.g, A.dur));
  const diff = (timeAtFrac(B, fA) - Math.min(C.g, A.dur)) / 1000;
  const read = $('cRead');
  if (read) read.innerHTML = C.g <= 0 ? '<span style="color:var(--muted);font-size:14px;font-weight:500">Press play to race the two laps</span>' : `<span style="color:${diff >= 0 ? ca : cb}">${esc(diff >= 0 ? codeOf(C.a) : codeOf(C.b))} +${Math.abs(diff).toFixed(3)} s</span>`;
  const sc = $('cScrub'); if (sc && document.activeElement !== sc) sc.value = String(Math.round(C.g / Math.max(A.dur, B.dur) * 1000));
  for (const [id, F] of [['cNow1', C.Fs], ['cNow2', C.Fd], ['cNow3', C.Ft]]){
    const el = document.getElementById(id); if (!el || !F) continue;
    const x = C.g > 0 ? F.sx(fA * 100) : -10; el.setAttribute('x1', x); el.setAttribute('x2', x);
  }
}
function tickCompare(dt){
  const C = S.cmp; if (!C.playing) return;
  const A = trace(C.a, C.la), B = trace(C.b, C.lb); if (!A || !B){ C.playing = false; return; }
  C.g += dt * C.speed;
  const end = Math.max(A.dur, B.dur);
  if (C.g >= end){ C.g = end; C.playing = false; const b = $('cPlay'); if (b) b.innerHTML = PLAY_ICON; }
  drawCompare();
}

/* ---------- timeline ---------- */
function buildMarks(){
  const marks = $('marks'); marks.innerHTML = '';
  const span = S.t1 - S.t0; if (!(span > 0)) return;
  const pct = t => ((t - S.t0) / span * 100).toFixed(3) + '%';
  for (const p of S.periods){
    const a = Math.max(p.a, S.t0), b = Math.min(p.b, S.t1); if (b <= a) continue;
    const el = document.createElement('div'); el.className = 'band';
    el.style.left = pct(a); el.style.width = ((b - a) / span * 100).toFixed(3) + '%';
    el.style.background = p.kind === 'red' ? COL.red : COL.flag;
    marks.appendChild(el);
  }
  for (const e of S.events){
    if (groupOf(e) !== 'key' || e.k === 'green' || e.t < S.t0 || e.t > S.t1) continue;
    const b = document.createElement('button'); b.className = 'pin'; b.type = 'button';
    b.dataset.k = e.k; b.style.left = pct(e.t); b.style.setProperty('--c', EV_COLOR[e.k]);
    b.title = (e.lap ? 'Lap ' + e.lap + ': ' : '') + e.text; b.setAttribute('aria-label', b.title);
    b.innerHTML = '<i></i>';
    b.onclick = () => seekTo(e.t - 5000);
    marks.appendChild(b);
  }
  if (!S.isRace) return;
  let most = [];
  for (const k in S.lapsBy) if (S.lapsBy[k].length > most.length) most = S.lapsBy[k];
  for (const l of most){
    if (l.v % 5 || l.t > S.t1) continue;
    const el = document.createElement('div'); el.className = 'tick'; el.style.left = pct(l.t);
    if (l.v % 10 === 0) el.innerHTML = `<em>${l.v}</em>`;
    marks.appendChild(el);
  }
}
function seekTo(t){
  if (!S.loaded) return;
  S.t = Math.min(S.t1, Math.max(S.t0, t)); S.seeked = true;
  $('toast').hidden = true; updateUI();
}
let dragging = false;
const slider = $('slider');
slider.addEventListener('pointerdown', () => dragging = true);
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointercancel', () => dragging = false);
slider.addEventListener('input', () => seekTo(S.t0 + (+slider.value) * 1000));

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>';
function setPlaying(on){
  S.playing = on;
  $('playBtn').innerHTML = on ? PAUSE_ICON : PLAY_ICON;
  $('playBtn').setAttribute('aria-label', on ? 'Pause' : 'Play');
}
$('playBtn').onclick = () => {
  if (!S.loaded) return;
  if (!S.playing && S.t >= S.t1 - 1000) seekTo(S.raceStart - 30000);
  setPlaying(!S.playing);
};
$('speedSel').onchange = e => { S.speed = +e.target.value; updateUI(); };
$('rotateBtn').onclick = () => { S.rot = (S.rot + 1) % 4; fitMap(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => { x.setAttribute('aria-selected', String(x === b)); $(x.dataset.pane).hidden = x !== b; });
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.code === 'Space' && !e.target.closest('button')){ e.preventDefault(); $('playBtn').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft'){
    const step = (e.shiftKey ? 60000 : 10000) * (e.code === 'ArrowRight' ? 1 : -1);
    seekTo(S.t + step);
  }
});

/* ---------- main loop ---------- */
let lastFrame = performance.now(), lastUI = 0;
function frame(now){
  const dt = Math.min(100, now - lastFrame); lastFrame = now;
  if (S.loaded){
    if (S.playing){
      S.t += dt * S.speed;
      if (S.t >= S.t1){ S.t = S.t1; setPlaying(false); }
    }
    if (S.view === 'track'){ draw(); updateTelPanel(); }
    if (S.view === 'compare') tickCompare(dt);
    if (now - lastUI > 200){ updateUI(); lastUI = now; }
  }
  requestAnimationFrame(frame);
}

setPlaying(false);
init();
requestAnimationFrame(frame);
</script>
</body>
</html>
